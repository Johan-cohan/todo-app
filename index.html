<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button test</title>
    <link rel="stylesheet" href="style.css">
    <script>
    (function() {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        }
    })();
    </script>
</head>
<body>
    <main class="app">
        <button id="themeToggle" class="theme-toggle" aria-label="Переключить тему">🌃</button>
        <div class="search-row">
            <input id="searchInput" type="text" placeholder="Поиск по задачам...">
        </div>
        <div class="input-row">
            <input id="taskInput" type="text" placeholder="Что нужно сделать?">
            <button id="addButton">Добавить</button>
        </div>
        <ul id="taskList"></ul>
        <p id="taskCounter" class="task-counter">Всего: 0</p>
        <p id="emptyMessage" class="empty-message">Пока пусто. Добавь первую задачу 👆</p>
        
    </main>
    
    <script src="app.js"></script>
</body>
</html>
